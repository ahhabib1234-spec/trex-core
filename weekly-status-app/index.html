<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Status Report</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --panel: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6b66;
      --line: #e3e2dd;
      --accent: #2f5d8a;
      --green-bg: #e7f3ea;
      --green: #1f6b36;
      --amber-bg: #fbf1dc;
      --amber: #8a5a00;
      --red-bg: #f8e4e2;
      --red: #9b2c20;
      --unknown-bg: #ecebe7;
      --unknown: #55554f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 28px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr);
      gap: 20px;
      padding: 20px 28px 40px;
      align-items: start;
    }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    section.panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px 20px;
    }
    h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
    label span { font-weight: 400; color: var(--muted); }
    textarea, input[type="date"] {
      width: 100%;
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
    }
    textarea { min-height: 120px; resize: vertical; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .dates { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    button {
      font: inherit;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: var(--red); font-size: 13px; margin-top: 12px; }
    .report-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .period { color: var(--muted); font-size: 13px; }
    .pill {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--unknown-bg);
      color: var(--unknown);
    }
    .pill.GREEN { background: var(--green-bg); color: var(--green); }
    .pill.AMBER { background: var(--amber-bg); color: var(--amber); }
    .pill.RED { background: var(--red-bg); color: var(--red); }
    .reasons { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
    h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 20px 0 6px;
      font-weight: 600;
    }
    ul.items { margin: 0; padding-left: 18px; }
    ul.items li { margin: 4px 0; }
    .meta { color: var(--muted); font-size: 12px; margin-left: 4px; white-space: nowrap; }
    .empty { color: var(--muted); font-size: 14px; margin: 0; }
    .coverage { font-size: 13px; color: var(--muted); margin: 0; padding-left: 18px; }
    .placeholder { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Weekly Status Report</h1>
    <p>Paste Teams messages, Outlook emails, and the Atlassian page for the week, then generate the status. Everything runs in your browser; nothing is sent to a server.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Inputs</h2>
      <form id="form" novalidate>
        <div class="dates">
          <div>
            <label for="start">Week start</label>
            <input type="date" id="start" required />
          </div>
          <div>
            <label for="end">Week end</label>
            <input type="date" id="end" required />
          </div>
        </div>

        <label for="teams">Teams messages <span>(optional)</span></label>
        <textarea id="teams" placeholder="Paste messages. Put a date line such as &quot;Tuesday, November 10, 2026&quot; above each day's messages, or include timestamps. Separate messages with a blank line."></textarea>

        <label for="outlook">Outlook emails <span>(optional)</span></label>
        <textarea id="outlook" placeholder="Paste emails as-is. From, Sent, and Subject headers are detected. Separate emails with a blank line or a line of dashes."></textarea>

        <label for="page">Atlassian page <span>(optional)</span></label>
        <textarea id="page" placeholder="Paste the On-Prem Controller update page text. Headings become report context."></textarea>

        <label for="notes">Additional notes <span>(optional)</span></label>
        <textarea id="notes" placeholder="Anything else to include, one point per line."></textarea>

        <div class="actions">
          <button type="submit" class="primary">Generate report</button>
          <button type="button" id="clear">Clear inputs</button>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
      </form>
    </section>

    <section class="panel" id="output" aria-live="polite">
      <h2>Report</h2>
      <p class="placeholder" id="placeholder">Generate a report to see the weekly status here.</p>
      <div id="report" hidden>
        <div class="report-head">
          <div>
            <span class="pill" id="status-pill"></span>
            <span class="period" id="period"></span>
          </div>
          <div class="actions" style="margin-top:0">
            <button type="button" id="copy">Copy Markdown</button>
            <button type="button" id="download">Download .md</button>
          </div>
        </div>
        <ul class="reasons" id="reasons"></ul>
        <div id="sections"></div>
        <h3>Source coverage</h3>
        <ul class="coverage" id="coverage"></ul>
      </div>
    </section>
  </main>

  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
